name: Draft Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag version before creating a release
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version mygo.json)"
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to upload artifacts to a published release." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "Pre-release build for review. The macOS artifact is ad-hoc signed and is not notarized. Do not publish it publicly until Developer ID signing, notarization, and manual platform acceptance are complete."
          fi

  macos-arm64:
    needs: draft-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version mygo.json)"
      - name: Build macOS Apple Silicon app and disk image
        run: go tool mygo build -platform darwin/arm64
      - name: Check draft status and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$is_draft" != "true" ]]; then
            echo "Refusing to upload artifacts to a published release." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" dist/darwin-arm64/*.dmg --repo "$GITHUB_REPOSITORY"

  windows-x64:
    needs: draft-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version mygo.json)"
      - name: Install NSIS for the Windows installer
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build Windows x64 app and installer
        run: go tool mygo build -platform windows/amd64
      - name: Check draft status and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$is_draft" != "true" ]]; then
            echo "Refusing to upload artifacts to a published release." >&2
            exit 1
          fi
          files=(dist/windows-amd64/*.exe)
          test -e "${files[0]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY"
